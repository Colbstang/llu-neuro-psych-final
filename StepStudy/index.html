<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="step-token" content="__STEP_TOKEN__">
  <title>Step Study</title>
  <link rel="stylesheet" href="/step.css">
  <link rel="stylesheet" href="/workspace_tools.css">
  <script src="/terms/term_cards.js" defer></script>
  <script src="/terms/selection_lookup.js" defer></script>
  <script src="/shortcuts.js" defer></script>
  <script src="/navigation.js" defer></script>
  <link rel="stylesheet" href="/anki_review.css">
  <script src="/anki_review.js" defer></script>
  <script src="/workspace_tools.js" defer></script>
  <link rel="stylesheet" href="/learning_flow.css">
  <link rel="stylesheet" href="/repair_practice.css">
  <link rel="stylesheet" href="/visual_practice.css">
  <script src="/learning_flow.js" defer></script>
  <script src="/repair_practice.js" defer></script>
  <script src="/visual_practice.js" defer></script>
  <script src="/step.js" defer></script>
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="#today"><span>S</span> Step Study</a>
    <nav aria-label="Study workspace">
      <button data-view="today">Today <span id="queue-badge"></span></button>
      <button data-view="session">Study session</button>
      <div class="nav-group" data-group="learn"><div class="nav-group-label">Learn</div>
        <button data-view="read">Read &amp; understand</button>
        <button data-view="objectives">Learning objectives</button>
        <button data-view="labs">Interactive labs</button>
      </div>
      <div class="nav-group" data-group="practice"><div class="nav-group-label">Practice</div>
        <button data-view="cards">Anki sessions</button>
        <button data-view="recall">Concept recall</button>
        <button data-view="visual">Visual recall</button>
        <button data-view="course-questions">Course questions</button>
        <button data-view="pathology">Pathology</button>
        <button data-view="drugs">Drugs</button>
        <button data-view="bugs">Microbiology</button>
      </div>
      <div class="nav-group" data-group="organize"><div class="nav-group-label">Organize</div>
        <button data-view="topics">Subjects</button>
        <button data-view="questions">Question inbox <span id="question-badge"></span></button>
      </div>
    </nav>
    <div class="sidebar-label">IN YOUR STUDY POOL</div>
    <div id="active-topics" class="active-topics"></div>
    <div class="module-link"><span class="sidebar-label">POPULATED MODULE</span><button id="course-module-start">Neuro / Psych</button><small>Guide · LOs · images · references</small></div>
    <div class="sidebar-bottom"><button id="settings-button">Settings &amp; backup</button><span id="save-status" role="status">Connecting…</span></div>
  </aside>
  <div class="app-body">
    <header class="topbar"><div class="location-bar"><div class="history-controls" aria-label="Page history"><button id="page-back" aria-label="Back" title="Back · ⌘[">←</button><button id="page-forward" aria-label="Forward" title="Forward · ⌘]">→</button></div><div><span id="view-label">Today</span><small id="scope-label">Your active subjects</small></div></div><div class="top-actions"><label><input id="automatic-terms" type="checkbox" checked> Define terms</label><button id="open-reference">Reference ↗</button><button id="study-shortcuts" title="Study shortcuts · ?">Shortcuts</button><button id="capture-question" title="Capture a selected screenshot region · ⌘⇧2">Capture question</button><button id="sync-anki">Sync Anki</button></div></header>
    <div id="workspace" class="workspace">
      <main id="main-content" tabindex="-1"><p>Loading your study workspace…</p></main>
      <section id="course-host" class="course-host" aria-label="Neuro and Psychiatry study module" hidden></section>
      <div id="splitter" class="splitter" role="separator" aria-label="Resize reading and reference panes" aria-orientation="vertical" tabindex="0"></div>
      <aside id="reference-pane" class="reference-pane" aria-label="Medical reference" hidden>
        <div class="reference-top"><div><button id="definition-back" aria-label="Previous definition">←</button><button id="definition-forward" aria-label="Next definition">→</button></div><button id="close-reference" aria-label="Close reference pane">×</button></div>
        <form id="definition-search"><label class="sr-only" for="definition-query">Find a medical term</label><input id="definition-query" type="search" maxlength="160" placeholder="Any medical term…" autocomplete="off"><button>Define</button></form>
        <div id="reference-content"><p class="muted">Select any word or phrase, then choose Define. You can also type a term here.</p></div>
      </aside>
    </div>
  </div>
  <div id="quick-definition" class="quick-definition" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
